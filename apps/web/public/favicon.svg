<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <!-- Ngôi sao lấp lánh gradient tím, cùng màu với chữ "LLM Chat" (violet-600 → purple-500 → fuchsia-500) -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <path id="star" d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/>
  </defs>
  <g fill="url(#g)" stroke="url(#g)" stroke-width="1.2" stroke-linejoin="round">
    <!-- sao lớn, lệch xuống dưới bên trái -->
    <use href="#star" transform="translate(-0.9 4.1) scale(1.2)"/>
    <!-- sao nhỏ góc trên bên phải -->
    <use href="#star" transform="translate(20.46 1.46) scale(0.42)"/>
