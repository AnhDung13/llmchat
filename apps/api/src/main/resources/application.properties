spring.application.name=llmchat

# Cổng 8080 trên máy này đã bị một container Docker chiếm.
# Frontend trỏ tới đây qua VITE_API_URL trong apps/web/.env.local
server.port=8081

# PostgreSQL chạy bằng docker-compose.yml ở thư mục gốc (docker compose up -d).
# Biến môi trường ghi đè được, ví dụ SPRING_DATASOURCE_PASSWORD=...
spring.datasource.url=jdbc:postgresql://localhost:5432/llmchat
spring.datasource.username=llmchat
spring.datasource.password=llmchat

